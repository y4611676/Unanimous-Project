# =============================================================================
# Example: reproduces the "Business Analytics Report" ETL from ../../../work/
# using the generic template — same CSVs, same outputs, but everything is
# declarative.
#
# Drop this file's parent directory next to the raw CSVs and run:
#     python ../../run_pipeline.py config.yaml --src /path/to/raw_csvs
#
# This demonstrates that the template can fully cover the hand-written pipeline
# in work/step1_clean.py … step4_anonymize.py without any code changes.
# =============================================================================

paths:
  raw_dir: .
  out_dir: ./output

sources:
  - name: sale
    file: sale.csv
    date_cols: [sdate]
    numeric_cols: [tot, ttot, price, apcost, smoney, tprice]
    key_col: salno
    checks:
      - {type: non_negative, col: tot}

  - name: sales1
    file: sales1.csv
    numeric_cols: [prqty, price, pcost, indexs, rept2index]
    derived:
      - {name: rev, formula: "price * prqty"}
      - {name: cost, formula: "pcost * prqty"}
      - {name: gross, formula: "rev - cost"}
    checks:
      - {type: non_zero, col: price}

  - name: purc
    file: purc.csv
    date_cols: [pdate]
    numeric_cols: [tot, ttot, price, smoney, Tprice]
    key_col: purno

  - name: purcs1
    file: purcs1.csv
    numeric_cols: [prqty, price, indexs, rept4index]
    derived:
      - {name: purc_amt, formula: "price * prqty"}

  - name: cust
    file: cust.csv
    key_col: cusno

  - name: fact
    file: fact.csv
    key_col: facno

  - name: prod
    file: prod.csv
    numeric_cols: [price, price3, price4, qty, pcost, safeqty]
    key_col: prdno

  - name: stockqty
    file: stockqty.csv
    numeric_cols: [qty]

aggregations:
  # ── Monthly summary ───────────────────────────────────────────────────
  - name: monthly
    source: sale
    derive_period: {from: sdate}
    groupby: [ym]
    metrics:
      order_count: {col: salno, func: count}
      sales:       {col: tot,   func: sum}
    sort_by: ym
    ascending: true

  # ── Customer summary ──────────────────────────────────────────────────
  - name: cust_agg
    source: sale
    groupby: [cusno]
    metrics:
      order_count:    {col: salno, func: count}
      sales:          {col: tot,   func: sum}
      first_purchase: {col: sdate, func: min}
      last_purchase:  {col: sdate, func: max}
    joins:
      - {source: cust, on: cusno, cols: [cusnm]}
    share_of: sales
    sort_by: sales

  # ── Product summary (incl. gross margin) ──────────────────────────────
  - name: prod_agg
    source: sales1
    groupby: [prdno]
    metrics:
      units_sold:   {col: prqty, func: sum}
      sales:        {col: rev,   func: sum}
      cost:         {col: cost,  func: sum}
      gross_profit: {col: gross, func: sum}
      txn_count:    {col: salno, func: count}
    joins:
      - {source: prod, on: prdno, cols: [prdnm, classno, safeqty]}
    derived:
      - {name: gross_margin, formula: "gross_profit / sales"}
    sort_by: sales

  # ── Supplier summary ──────────────────────────────────────────────────
  - name: fact_agg
    source: purc
    groupby: [facno]
    metrics:
      po_count:     {col: purno, func: count}
      purchase_amt: {col: tot,   func: sum}
      first_po:     {col: pdate, func: min}
      last_po:      {col: pdate, func: max}
    joins:
      - {source: fact, on: facno, cols: [facnm]}
    sort_by: purchase_amt

analysis:
  rfm:
    enabled: true
    source: sale
    customer_col: cusno
    date_col: sdate
    amount_col: tot
    output: rfm

  pareto:
    - source: cust_agg
      dimension: cusno
      metric: sales
      output: pareto_customers
    - source: prod_agg
      dimension: prdno
      metric: sales
      output: pareto_products

  top_n:
    - {source: cust_agg, by: sales, n: 20, output: top20_customers}
    - {source: prod_agg, by: sales, n: 20, output: top20_products}

output:
  excel:
    enabled: true
    filename: business_analytics_report.xlsx
    source: aggregated
    sheets:
      - {from: monthly,  title: Monthly Revenue, number_cols: [sales]}
      - {from: cust_agg, title: Customer Ranking, number_cols: [sales],
         percent_cols: [share, cum_share]}
      - {from: prod_agg, title: Product Ranking, number_cols: [sales, gross_profit],
         percent_cols: [gross_margin]}
      - {from: fact_agg, title: Supplier Ranking, number_cols: [purchase_amt]}
      - {from: rfm, stage: analyzed, title: Customer RFM}
      - {from: pareto_customers, stage: analyzed, title: Customer 80-20,
         number_cols: [sales], percent_cols: [share, cum_share]}
      - {from: pareto_products,  stage: analyzed, title: Product 80-20,
         number_cols: [sales], percent_cols: [share, cum_share]}

anonymization:
  seed: 20240101
  money_scale: {mode: random}
  date_shift_months: random
  id_mappings:
    - {col: cusno, prefix: CUST, label_col: cusnm, label: Cust}
    - {col: prdno, prefix: PROD, label_col: prdnm, label: Prod}
    - {col: facno, prefix: SUPP, label_col: facnm, label: Supp}
  rules:
    monthly:
      money_cols: [sales]
    cust_agg:
      money_cols: [sales]
      date_cols: [first_purchase, last_purchase]
    prod_agg:
      money_cols: [sales, cost, gross_profit]
    fact_agg:
      money_cols: [purchase_amt]
      date_cols: [first_po, last_po]
    sale:
      date_cols: [sdate]
      money_cols: [tot, price]
    purc:
      date_cols: [pdate]
      money_cols: [tot, price]
